name: Tests

permissions:
  contents: read  # Check out the source for tests.

on:
  # https://docs.github.com/en/webhooks-and-events/webhooks/webhook-events-and-payloads#push
  push:
    branches:
      - main
      - feature/**
      - '[0-9].*.x'  # e.g., 3.24.x
      - '[0-9][0-9].*.x'  # e.g., 23.3.x

  # https://docs.github.com/en/webhooks-and-events/webhooks/webhook-events-and-payloads#pull_request
  pull_request:

  # https://docs.github.com/en/webhooks-and-events/webhooks/webhook-events-and-payloads#workflow_dispatch
  workflow_dispatch:
    inputs:
      os:
        description: Which OS to test
        type: choice
        default: all
        options: [all, linux, macos, windows]

  # no payload
  schedule:
      # https://crontab.guru/#37_18_*_*_*
    - cron: 37 18 * * *

concurrency:
  # Concurrency group that uses the workflow name and PR number if available
  # or commit SHA as a fallback. If a new build is triggered under that
  # concurrency group while a previous build is running it will be canceled.
  # Repeated pushes to a PR will cancel all previous builds, while multiple
  # merges to main will not cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # https://conda.github.io/conda-libmamba-solver/user-guide/configuration/#advanced-options
  CONDA_LIBMAMBA_SOLVER_NO_CHANNELS_FROM_INSTALLED: true

jobs:
  # detect whether any code changes are included in this PR
  changes:
    runs-on: ubuntu-slim
    permissions:
      # https://github.com/dorny/paths-filter#supported-workflows
      contents: read  # Check out the source for non-PR events.
      pull-requests: read  # Read the changed files in a PR.
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # dorny/paths-filter needs git clone for non-PR events
        # https://github.com/dorny/paths-filter#supported-workflows
        if: github.event_name != 'pull_request'
        with:
          persist-credentials: false

      - name: Filter Changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: main
          filters: |
            code:
              - 'conda_build/**'
              - 'tests/**'
              - '*.py'
              - 'recipe/**'
              - '.github/workflows/tests.yml'
              - '.github/condarc'
              - 'pyproject.toml'

  # linux test suite
  linux:
    # only run test suite if there are code changes
    needs: changes
    if: >-
      (github.event_name == 'schedule' || needs.changes.outputs.code == 'true') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.os == 'all' || github.event.inputs.os == 'linux')

    runs-on: ubuntu-latest
    defaults:
      run:
        # https://github.com/conda-incubator/setup-miniconda#use-a-default-shell
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        # For PRs: test only boundary versions (3.10, 3.13)
        # For main/schedule: test all versions (3.10, 3.12, 3.13)
        # Note: 3.11 skipped as 3.10 and 3.12 provide sufficient coverage
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.10", "3.13"]') || fromJSON('["3.10", "3.12", "3.13"]') }}
        conda-version: [release]
        test-type: [serial, parallel]
        include:
          # minimum Python/conda combo
          - python-version: '3.10'
            conda-version: 26.1.0
            test-type: serial
          - python-version: '3.10'
            conda-version: 26.1.0
            test-type: parallel
          # maximum Python/conda combo
          - python-version: '3.14'
            conda-version: canary
            test-type: serial
          - python-version: '3.14'
            conda-version: canary
            test-type: parallel
    env:
      TEST_PYTHON_VERSION: ${{ matrix.python-version }}
      CONDA_CHANNEL_LABEL: ${{ matrix.conda-version == 'canary' && 'conda-canary/label/dev::' || '' }}
      CONDA_VERSION: ${{ contains('canary|release', matrix.conda-version) && 'conda' || format('conda={0}', matrix.conda-version) }}
      # Exclude benchmark tests from regular CI runs (they run separately in linux-benchmarks)
      PYTEST_MARKER: ${{ matrix.test-type == 'serial' && 'serial and not benchmark' || 'not serial and not benchmark' }}

    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@2a22f8c59cae9cddae7194b33e6b92d023b2b4b8  # v4.0.0
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: false
          remove_packages: >-
            azure-cli
            google-cloud-cli
            microsoft-edge-stable
            google-chrome-stable
            firefox
            postgresql*
            temurin-*
            *llvm*
            mysql*
            dotnet-sdk-*
          remove_packages_one_command: true
          remove_folders: >-
            /usr/share/swift
            /usr/share/az*
            /usr/local/lib/node_modules
            /usr/local/share/chromium
            /usr/local/share/powershell
            /usr/local/julia
            /usr/local/aws-cli
            /usr/local/aws-sam-cli
            /usr/share/gradle
          rm_cmd: rmz
          rmz_version: 3.1.1
          testing: false

      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Hash + Timestamp
        env:
          HASH_PREFIX: ${{ runner.os }}-${{ runner.arch }}-Py${{ matrix.python-version }}-${{ matrix.conda-version }}-${{ matrix.test-type }}
        run: echo "HASH=${HASH_PREFIX}-$(date -u "+%Y%m")" >> "$GITHUB_ENV"

      - name: Cache Conda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/conda_pkgs_dir
          key: cache-${{ env.HASH }}
          # Fallback to any cache for same OS/arch/Python, then any OS/arch cache
          restore-keys: |
            cache-${{ runner.os }}-${{ runner.arch }}-Py${{ matrix.python-version }}-
            cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          condarc-file: .github/condarc
          run-post: false  # skip post cleanup

      - name: Conda Install
        run: >
          conda install
          --yes
          --file tests/requirements.txt
          --file "tests/requirements-${RUNNER_OS}.txt"
          --file tests/requirements-ci.txt
          "python=${TEST_PYTHON_VERSION}"
          "${CONDA_CHANNEL_LABEL}${CONDA_VERSION}"

      # TODO: how can we remove this step?
      - name: Install Self
        run: pip install -e . --no-deps --no-build-isolation --break-system-packages

      - name: Conda Info
        # view test env info (not base)
        run: python -m conda info --verbose

      - name: Conda List
        run: conda list --show-channel-urls

      - name: Run Tests
        run: >
          pytest
          --cov=conda_build
          --durations-path="durations/${RUNNER_OS}.json"
          --reruns 1
          --reruns-delay 1
          -n auto
          -m "$PYTEST_MARKER"

      - name: Upload Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          flags: ${{ runner.os }},${{ runner.arch }},${{ matrix.python-version }},${{ matrix.test-type }}

      - name: Upload Test Results
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ env.HASH }}
          include-hidden-files: true
          path: |
            .coverage
            durations/${{ runner.os }}.json
            test-report.xml
          retention-days: 1  # temporary, combined in aggregate below

  # linux benchmarks
  linux-benchmarks:
    # only run test suite if there are code changes
    needs: changes
    if: >-
      (needs.changes.outputs.code == 'true') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.os == 'all' || github.event.inputs.os == 'linux')


    runs-on: ubuntu-latest
    defaults:
      run:
        # https://github.com/conda-incubator/setup-miniconda#use-a-default-shell
        shell: bash -el {0}  # bash exit immediately on error + login shell
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    env:
      TEST_PYTHON_VERSION: ${{ matrix.python-version }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Hash + Timestamp
        env:
          HASH_PREFIX: ${{ runner.os }}-${{ runner.arch }}-Py${{ matrix.python-version }}-benchmark
        run: echo "HASH=${HASH_PREFIX}-$(date -u "+%Y%m")" >> "$GITHUB_ENV"

      - name: Cache Conda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/conda_pkgs_dir
          key: cache-${{ env.HASH }}
          # Fallback to any cache for same OS/arch/Python, then any OS/arch cache
          restore-keys: |
            cache-${{ runner.os }}-${{ runner.arch }}-Py${{ matrix.python-version }}-
            cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          condarc-file: .github/condarc
          run-post: false  # skip post cleanup

      - name: Conda Install
        run: >
          conda install
          --yes
          --file tests/requirements.txt
          --file "tests/requirements-${RUNNER_OS}.txt"
          --file tests/requirements-ci.txt
          --file tests/requirements-benchmarks.txt
          "python=${TEST_PYTHON_VERSION}"

      # TODO: how can we remove this step?
      - name: Install Self
        run: pip install -e .

      - name: Conda Info
        # view test env info (not base)
        run: python -m conda info --verbose

      - name: Conda Config
        run: conda config --show-sources

      - name: Conda List
        run: conda list --show-channel-urls

      - name: Run Benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: $CONDA/envs/test/bin/pytest --codspeed
          mode: instrumentation

  # windows test suite
  windows:
    # only run test suite if there are code changes
    needs: changes
    if: >-
      (github.event_name == 'schedule' || needs.changes.outputs.code == 'true') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.os == 'all' || github.event.inputs.os == 'windows')


    runs-on: ${{ matrix.runs-on && matrix.runs-on || 'windows-2022' }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          # test lower version (w/ stable conda)
          - python-version: '3.10'
            conda-version: release
            test-type: serial
          - python-version: '3.10'
            conda-version: release
            test-type: parallel
          # upper version (w/ canary conda)
          - python-version: '3.14'
            conda-version: canary
            test-type: serial
          - python-version: '3.14'
            conda-version: canary
            test-type: parallel
          - python-version: '3.14'
            conda-version: release
            test-type: custom
            pytest-expression: test_build_command_win_arm64_wrapper or test_win_arm64_build_on_emulated_win_64
            runs-on: windows-11-arm
    env:
      ErrorActionPreference: Stop  # powershell exit on first error
      TEST_PYTHON_VERSION: ${{ matrix.python-version }}
      CONDA_CHANNEL_LABEL: ${{ matrix.conda-version == 'canary' && 'conda-canary/label/dev' || 'defaults' }}
      # Exclude benchmark and slow tests from Windows parallel runs
      PYTEST_MARKER: ${{ matrix.test-type == 'serial' && 'serial and not benchmark' || (matrix.test-type == 'parallel' && 'not serial and not slow and not benchmark' || '') }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Hash + Timestamp
        shell: bash  # use bash to run date command
        env:
          HASH_PREFIX: ${{ runner.os }}-${{ runner.arch }}-Py${{ matrix.python-version }}-${{ matrix.conda-version }}-${{ matrix.test-type }}
        run: echo "HASH=${HASH_PREFIX}-$(date -u "+%Y%m")" >> "$GITHUB_ENV"

      - name: Cache Conda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Use faster GNU tar for all runners
          enableCrossOsArchive: true
          path: D:\conda_pkgs_dir
          key: cache-${{ env.HASH }}
          # Fallback to any cache for same OS/arch/Python, then any OS/arch cache
          restore-keys: |
            cache-${{ runner.os }}-${{ runner.arch }}-Py${{ matrix.python-version }}-
            cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          condarc-file: .github\condarc
          run-post: false  # skip post cleanup
          pkgs-dirs: ${{ runner.arch == 'ARM64' && 'C' || 'D'}}:\conda_pkgs_dir
          installation-dir: ${{ runner.arch == 'ARM64' && 'C' || 'D'}}:\conda
          # force x64 even on ARM64 to test emulation
          architecture: x64
        env:
          CONDA_SUBDIR: win-64

      - name: Choco Install
        if: runner.arch != 'ARM64'
        # We may need the complete tooling so that cmake tests pass on windows
        run: choco install visualstudio2017-workload-vctools

      - name: Conda Install
        run: >
          conda install
          --yes
          --file tests\requirements.txt
          --file "tests\requirements-${env:RUNNER_OS}.txt"
          --file tests\requirements-ci.txt
          "python=${env:TEST_PYTHON_VERSION}"
          "${env:CONDA_CHANNEL_LABEL}::conda"

      # TODO: how can we remove this step?
      - name: Install Self
        run: pip install -e . --no-deps --no-build-isolation --break-system-packages

      - name: Conda Info
        # view test env info (not base)
        run: python -m conda info --verbose

      - name: Conda List
        run: conda list --show-channel-urls

      - name: Run Tests
        # Windows is sensitive to long paths, using RUNNER_TEMP to
        # keep the test directories shorter
        env:
          PYTEST_EXPRESSION: ${{ matrix.pytest-expression }}
        run: |
          $pytestArgs = @(
            '--cov=conda_build'
            "--basetemp=${env:RUNNER_TEMP}"
            "--durations-path=durations\${env:RUNNER_OS}.json"
            '-n', 'auto'
          )
          if ($env:PYTEST_MARKER) {
            $pytestArgs += @('-m', $env:PYTEST_MARKER)
          }
          if ($env:PYTEST_EXPRESSION) {
            $pytestArgs += @('-k', $env:PYTEST_EXPRESSION)
          }
          pytest @pytestArgs

      - name: Upload Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          flags: ${{ runner.os }},${{ runner.arch }},${{ matrix.python-version }},${{ matrix.test-type }}

      - name: Upload Test Results
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ env.HASH }}
          include-hidden-files: true
          path: |
            .coverage
            durations\${{ runner.os }}.json
            test-report.xml
          retention-days: 1  # temporary, combined in aggregate below

  # macos test suite
  macos:
    # only run test suite if there are code changes
    needs: changes
    if: >-
      (github.event_name == 'schedule' || needs.changes.outputs.code == 'true') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.os == 'all' || github.event.inputs.os == 'macos')

    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        # https://github.com/conda-incubator/setup-miniconda#use-a-default-shell
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          # test lower version (w/ osx-64 & stable conda)
          - python-version: '3.10'
            conda-version: release
            test-type: serial
            runs-on: macos-15-intel  # osx-64
          - python-version: '3.10'
            conda-version: release
            test-type: parallel
            runs-on: macos-15-intel  # osx-64
          # upper version (w/ osx-arm64 & canary conda)
          - python-version: '3.14'
            conda-version: canary
            test-type: serial
            runs-on: macos-latest  # osx-arm64
          - python-version: '3.14'
            conda-version: canary
            test-type: parallel
            runs-on: macos-latest  # osx-arm64
    env:
      TEST_PYTHON_VERSION: ${{ matrix.python-version }}
      # Use conda-forge for release tests since conda 25.11+ is not in defaults for osx-64
      CONDA_CHANNEL_LABEL: ${{ matrix.conda-version == 'canary' && 'conda-canary/label/dev' || 'conda-forge' }}
      # Exclude benchmark tests from regular CI runs
      PYTEST_MARKER: ${{ matrix.test-type == 'serial' && 'serial and not benchmark' || 'not serial and not benchmark' }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Hash + Timestamp
        env:
          HASH_PREFIX: ${{ runner.os }}-${{ runner.arch }}-Py${{ matrix.python-version }}-${{ matrix.conda-version }}-${{ matrix.test-type }}
        run: echo "HASH=${HASH_PREFIX}-$(date -u "+%Y%m")" >> "$GITHUB_ENV"

      - name: Cache Conda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/conda_pkgs_dir
            ~/macosx_sdks
          key: cache-${{ env.HASH }}
          # Fallback to any cache for same OS/arch/Python, then any OS/arch cache
          restore-keys: |
            cache-${{ runner.os }}-${{ runner.arch }}-Py${{ matrix.python-version }}-
            cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          condarc-file: .github/condarc
          run-post: false  # skip post cleanup

      - name: SDK Download
        # SDK needed for cross-compilation tests
        # ARM64 runners: use 11.3 SDK, Intel runners: use 10.15 SDK
        env:
          TEST_RUNNER_IMAGE: ${{ matrix.runs-on }}
        run: |
          if [ "$TEST_RUNNER_IMAGE" = "macos-latest" ]; then
            MACOSX_SDK_ROOT="$(xcrun --sdk macosx --show-sdk-path)"
          else
            MACOSX_SDK_VERSION=10.15
            MACOSX_SDK_SHA256=ac75d9e0eb619881f5aa6240689fce862dcb8e123f710032b7409ff5f4c3d18b

            MACOSX_SDK_DIR="${HOME}/macosx_sdks"
            if [ ! -d "${MACOSX_SDK_DIR}" ]; then mkdir "${MACOSX_SDK_DIR}"; fi

            MACOSX_SDK_ROOT="${MACOSX_SDK_DIR}/MacOSX${MACOSX_SDK_VERSION}.sdk"
            if [ ! -d "${MACOSX_SDK_ROOT}" ]; then
              url="https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX${MACOSX_SDK_VERSION}.sdk.tar.xz"
              curl -L --output "MacOSX${MACOSX_SDK_VERSION}.sdk.tar.xz" "${url}"

              echo "${MACOSX_SDK_SHA256} *MacOSX${MACOSX_SDK_VERSION}.sdk.tar.xz" | shasum -a 256 -c
              tar -xf "MacOSX${MACOSX_SDK_VERSION}.sdk.tar.xz" -C "${MACOSX_SDK_DIR}"
            fi
          fi
          echo "MACOSX_SDK_ROOT=${MACOSX_SDK_ROOT}" >> "$GITHUB_ENV"

      - name: Conda Install
        run: >
          conda install
          --yes
          --file tests/requirements.txt
          --file "tests/requirements-${RUNNER_OS}.txt"
          --file tests/requirements-ci.txt
          "python=${TEST_PYTHON_VERSION}"
          "${CONDA_CHANNEL_LABEL}::conda"

      # TODO: how can we remove this step?
      - name: Install Self
        run: pip install -e . --no-deps --no-build-isolation --break-system-packages

      - name: Conda Info
        # view test env info (not base)
        run: python -m conda info --verbose

      - name: Conda List
        run: conda list --show-channel-urls

      - name: Run Tests
        run: >
          pytest
          --cov=conda_build
          --durations-path="durations/${RUNNER_OS}.json"
          -n auto
          -m "$PYTEST_MARKER"
        env:
          CONDA_BUILD_SYSROOT: ${{ env.MACOSX_SDK_ROOT }}

      - name: Upload Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          flags: ${{ runner.os }},${{ runner.arch }},${{ matrix.python-version }},${{ matrix.test-type }}

      - name: Upload Test Results
        if: '!cancelled()'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ env.HASH }}
          include-hidden-files: true
          path: |
            .coverage
            durations/${{ runner.os }}.json
            test-report.xml
          retention-days: 1  # temporary, combined in aggregate below

  # aggregate and upload
  aggregate:
    # only aggregate test suite if there are code changes
    needs: [changes, linux, linux-benchmarks, windows, macos]
    if: >-
      !cancelled()
      && (
        github.event_name == 'schedule'
        || needs.changes.outputs.code == 'true'
      )

    runs-on: ubuntu-slim
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Upload Combined Test Results
        # provides one downloadable archive of all matrix run test results for further analysis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ github.sha }}-all
          include-hidden-files: true
          path: test-results-*
          retention-days: 7  # for combine-durations in update.yml

      - name: Test Summary
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: test-results-*/test-report.xml

  # required check
  analyze:
    needs: [linux, linux-benchmarks, windows, macos, aggregate]
    if: '!cancelled()'

    runs-on: ubuntu-slim
    steps:
      - name: Determine Success
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        id: alls-green
        with:
          # permit jobs to be skipped if there are no code changes (see changes job)
          allowed-skips: ${{ toJSON(needs) }}
          jobs: ${{ toJSON(needs) }}

      - name: Report failures
        if: >-
          always()
          && github.event_name == 'schedule'
          && steps.alls-green.outputs.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.AUTO_REPORT_TEST_FAILURE }}
        run: |
          DAY=$(date -u '+%Y-%m-%d')
          TITLE="${GITHUB_WORKFLOW} failed (${DAY})"
          BODY="The ${GITHUB_WORKFLOW} workflow failed at $(date -u '+%Y-%m-%d %H:%M') UTC

          Full run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"${TITLE}\" in:title label:source::auto" \
            --json number \
            --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$BODY"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body "$BODY" \
              --label "¡blocking!,type::bug,type::testing,source::auto"
          fi
